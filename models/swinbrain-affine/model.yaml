name: SwinBrain
authors:
  - Suo, X., et al.
submitted_by: Encin, Arel
description: Self-supervised Swin-UNETR brain MRI foundation model (encoder bottleneck, GAP-pooled)
preprocessing: turboprep-affine
preprocessing_label: "turboprep with affine registration to MNI 1 mm"
embedding_dim: 384
architecture: MONAI SwinUNETR encoder10 bottleneck, pretrained; adaptive-avg-pooled
citation: >-
  Suo, X., et al. Automatic identification of parkinsonism using clinical multi-contrast
  brain MRI: a large self-supervised vision foundation model strategy. EBioMedicine 116 (2025).
paper: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12155752/
code: https://github.com/MAI-Lab-West-China-Hospital/SwinBrain
weights: https://github.com/MAI-Lab-West-China-Hospital/SwinBrain#download-pretrained-models
weights_prestaged: true
cluster_only: true
cpus: 2
walltime: "12:00:00"
datasets:
  - NKI
  - HBN
  - PNC
  - BHRC
  - CCNP
tasks:
  - sex
  - age
  - bmi
  - p_factor_nonzero
  - p_factor
  - internalizing
  - externalizing
  - handedness
