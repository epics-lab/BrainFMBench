name: cluster-extract

on:
  push:
    branches: [main]
    paths:
      - "models/**/extract.py"
      - "models/**/weights.txt"
      - "models/**/model.yaml"
      - "models/**/requirements.txt"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cluster-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # a queued run checks out the commit it was queued on; catch up before reaping
      - run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml pandas pyarrow

      - name: Set up SSH (key + config + known_hosts)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          test -n "$SSH_KEY" || { echo "::error::secret SSH_PRIVATE_KEY empty or unset"; exit 1; }

          printf '%s\n' "$SSH_KEY" > ~/.ssh/openmribench_ci
          chmod 600 ~/.ssh/openmribench_ci
          cp ssh/config ~/.ssh/config
          chmod 600 ~/.ssh/config
          cp ssh/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          nc -z -w 5 206.12.103.105 22 \
            || { echo "::error::jump server 206.12.103.105:22 unreachable from runner"; exit 1; }

      - name: Run cluster runner (reap / sow)
        id: runner
        run: |
          set -o pipefail
          python cluster/cluster_runner.py | tee runner.log

      - name: Commit reaped features
        if: steps.runner.outputs.reaped != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A models
          git diff --staged --quiet && exit 0
          git commit -m "Cluster: add extracted features [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          echo "push failed after 3 attempts"; exit 1

      # scoring runs in score.yml as a parallel matrix (model x dataset x task x probe)
      - name: Score reaped models
        if: steps.runner.outputs.reaped != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run score.yml --ref main -R ${{ github.repository }} -f rescore_all=false -f slugs="${{ steps.runner.outputs.reaped }}"
