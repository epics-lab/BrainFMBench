name: cluster-extract

on:
  push:
    branches: [main]
    paths:
      - "models/**/extract.py"
      - "models/**/weights.txt"
      - "models/**/model.yaml"
      - "models/**/requirements.txt"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cluster-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Set up SSH (key + config + known_hosts)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/openmribench_ci
          chmod 600 ~/.ssh/openmribench_ci
          cp ssh/config ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -H 206.12.96.142 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run cluster runner (reap / sow)
        id: runner
        run: |
          set -o pipefail
          python cluster/cluster_runner.py | tee runner.log

      - name: Score newly reaped models
        if: steps.runner.outputs.reaped != ''
        run: |
          pip install -r eval/requirements-scoring.txt
          for slug in ${{ steps.runner.outputs.reaped }}; do
            python scripts/score_all.py "models/$slug"
          done
          python scripts/make_leaderboard.py

      - name: Commit reaped features + results + leaderboard
        if: steps.runner.outputs.reaped != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A models
          git add LEADERBOARD.md leaderboard_boxplots.png
          git diff --staged --quiet || git commit -m "Cluster: add extracted features + scores [skip ci]"
          git push
