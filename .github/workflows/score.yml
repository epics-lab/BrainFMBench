name: score

on:
  push:
    branches: [main]
    paths: ["models/**", "labels/**", "eval/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Rescore every model. Leave off to only rebuild the leaderboard and site."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: score
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml==6.0.2

      - name: Determine scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "all=${{ inputs.rescore_all }}" >> "$GITHUB_OUTPUT"
            echo "slugs=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || true)
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(eval/scorer\.py|labels/|scripts/score_all\.py)'; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            SLUGS=$(echo "$CHANGED" | grep '^models/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix
        id: matrix
        env:
          ALL: ${{ steps.scope.outputs.all }}
          SLUGS: ${{ steps.scope.outputs.slugs }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, yaml
          if os.environ["ALL"] == "true":
              models = sorted(os.path.basename(d.rstrip("/")) for d in glob.glob("models/*/"))
          else:
              models = [s for s in os.environ["SLUGS"].split() if os.path.isfile(f"models/{s}/model.yaml")]
          include = []
          for m in models:
              meta = yaml.safe_load(open(f"models/{m}/model.yaml"))
              for ds in meta.get("datasets", []):
                  for task in meta.get("tasks", []):
                      include.append({"model": m, "dataset": ds, "task": task})
          print("matrix=" + json.dumps({"include": include}))
          print("any=" + ("true" if include else "false"))
          PY
          cat "$GITHUB_OUTPUT"

  score:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: score ${{ matrix.model }} ${{ matrix.dataset }} ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r eval/requirements-scoring.txt

      - run: python scripts/score_all.py models/${{ matrix.model }} ${{ matrix.dataset }} ${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: part__${{ matrix.model }}__${{ matrix.dataset }}__${{ matrix.task }}
          path: models/${{ matrix.model }}/results.${{ matrix.dataset }}.${{ matrix.task }}.json
          retention-days: 1
          if-no-files-found: error

  leaderboard:
    needs: [plan, score]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.score.result == 'success' || needs.score.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r eval/requirements-scoring.txt

      - if: needs.score.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: part__*
          path: parts

      - if: needs.score.result == 'success'
        run: python scripts/merge_results.py parts

      - run: python scripts/make_leaderboard.py

      - name: Upload interactive leaderboard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit results + leaderboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A models
          git add LEADERBOARD.md leaderboard_boxplots.png README.md
          git diff --staged --quiet && exit 0
          git commit -m "Update results + leaderboard [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          echo "push failed after 3 attempts"; exit 1

  deploy-pages:
    needs: leaderboard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
