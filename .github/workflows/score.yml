name: score

on:
  push:
    branches: [main]
    paths: ["models/**", "labels/**", "eval/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Rescore every model. Leave off to only rebuild the leaderboard and site."
        type: boolean
        default: false
      slugs:
        description: "Space separated model folders to score, e.g. from cluster-extract. Empty means none."
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: score
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml==6.0.2

      - name: Determine scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "all=${{ inputs.rescore_all }}" >> "$GITHUB_OUTPUT"
            echo "slugs=${{ inputs.slugs }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || true)
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(eval/scorer\.py|labels/|scripts/score_all\.py)'; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            SLUGS=$(echo "$CHANGED" | grep '^models/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix
        id: matrix
        env:
          ALL: ${{ steps.scope.outputs.all }}
          SLUGS: ${{ steps.scope.outputs.slugs }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, yaml
          if os.environ["ALL"] == "true":
              models = sorted(os.path.basename(d.rstrip("/")) for d in glob.glob("models/*/"))
          else:
              models = [s for s in os.environ["SLUGS"].split() if os.path.isfile(f"models/{s}/model.yaml")]
          # one unit per (model, dataset, task, probe); units are packed into at most 256 jobs
          # (the GitHub matrix limit), so no single job runs every task of a heavy model
          units = []
          for m in models:
              meta = yaml.safe_load(open(f"models/{m}/model.yaml"))
              for ds in meta.get("datasets", []):
                  # features arrive later from cluster-extract, which scores them itself
                  if not any(os.path.isfile(f"models/{m}/features/{ds}{ext}") for ext in (".csv", ".parquet")):
                      continue
                  cols = open(f"labels/{ds}.csv").readline().strip().split(",")
                  # e.g. the p factor tasks exist for PNC only
                  tasks = [t for t in meta.get("tasks", []) if t in cols]
                  if not tasks:
                      continue
                  for probe in ("rf", "linear"):
                      units += [(m, ds, probe, t) for t in tasks]
          size = max(1, -(-len(units) // 256))
          include = []
          for i in range(0, len(units), size):
              ch = units[i:i + size]
              m, ds, probe, _ = ch[0]
              name = f"{m} {ds} {probe} " + " ".join(t for *_, t in ch) if all(u[:3] == ch[0][:3] for u in ch) \
                  else " | ".join(f"{a} {b} {c} {d}" for a, b, c, d in ch)
              include.append({"id": len(include), "name": name,
                              "units": " ".join(":".join(u) for u in ch)})
          print("matrix=" + json.dumps({"include": include}))
          print("any=" + ("true" if include else "false"))
          PY
          cat "$GITHUB_OUTPUT"

  score:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: score ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r eval/requirements-scoring.txt

      # each finished unit is copied to out/<model>/ right away, so a job that times out
      # still uploads the units it completed
      - run: |
          mkdir -p out && echo "${{ matrix.units }}" > out/units.txt
          rc=0
          for u in ${{ matrix.units }}; do
            IFS=: read -r m ds probe task <<< "$u"
            python scripts/score_all.py "models/$m" "$ds" "$task" "$probe" || rc=1
            mkdir -p "out/$m" && cp "models/$m/results.$ds.$task.$probe.json" "out/$m/" 2>/dev/null || rc=1
          done
          exit $rc

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part__${{ matrix.id }}
          path: out
          retention-days: 3
          if-no-files-found: warn

  leaderboard:
    needs: [plan, score]
    # runs even when some score jobs failed or timed out: finished units are merged,
    # missing ones keep their previous results (see merge_results.py)
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r eval/requirements-scoring.txt

      - if: needs.score.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: part__*
          path: parts

      - if: needs.score.result != 'skipped'
        run: python scripts/merge_results.py parts

      - run: python scripts/make_leaderboard.py

      - name: Build archived versions from release tags
        run: |
          # Every release tag v* is rebuilt from its own commit, with its own code and
          # results, and served at /<tag>/. The current main stays at the site root.
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            git worktree add -q "/tmp/$tag" "$tag"
            (cd "/tmp/$tag" && python scripts/make_leaderboard.py > /dev/null) || { echo "skip $tag"; continue; }
            mkdir -p "site/$tag" && cp -r "/tmp/$tag/site/." "site/$tag/"
          done
          python scripts/version_nav.py site

      - name: Upload interactive leaderboard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Mirror the same static site to a Hugging Face Space (issue #35). Skipped until the
      # HF_TOKEN secret (write access to the Space) and the HF_SPACE variable are set.
      - name: Mirror leaderboard to Hugging Face Space
        if: github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install -q huggingface_hub==0.26.2
          rm -rf /tmp/space && cp -r site /tmp/space
          cat > /tmp/space/README.md <<'MD'
          ---
          title: BrainFMBench
          emoji: 🧠
          colorFrom: green
          colorTo: blue
          sdk: static
          app_file: index.html
          pinned: true
          license: mit
          short_description: Living benchmark of structural MRI foundation models
          ---

          Mirror of the BrainFMBench leaderboard, rebuilt automatically from
          https://github.com/epics-lab/BrainFMBench on every update.
          MD
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path="/tmp/space",
              commit_message="Update leaderboard from epics-lab/BrainFMBench", delete_patterns=["*"])
          PY

      - name: Commit results + leaderboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A models
          git add LEADERBOARD.md leaderboard_boxplots.png leaderboard_overview.png README.md
          git diff --staged --quiet && exit 0
          git commit -m "Update results + leaderboard [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          echo "push failed after 3 attempts"; exit 1

  deploy-pages:
    needs: leaderboard
    if: ${{ always() && needs.leaderboard.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
