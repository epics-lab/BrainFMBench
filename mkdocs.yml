site_name: BrainFMBench
site_description: A living benchmark for structural brain MRI foundation models
site_url: https://www.epics-lab.ca/BrainFMBench/docs/
repo_url: https://github.com/epics-lab/BrainFMBench
repo_name: epics-lab/BrainFMBench
edit_uri: edit/main/docs/
docs_dir: .docs_build
site_dir: site/docs
copyright: Code MIT · labels CC BY-NC-SA 4.0 · EPICS Lab, Krembil Centre for Neuroinformatics, CAMH

theme:
  name: material
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    logo: material/brain
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/epics-lab/BrainFMBench
    - icon: simple/huggingface
      link: https://huggingface.co/spaces/epics-lab/BrainFMBench

nav:
  - Home: index.md
  - Leaderboard:
      - results/index.md
  - Models:
      - models/index.md
  - Datasets:
      - datasets/index.md
      - Tasks: tasks.md
      - Preprocessing: preprocessing.md
  - Submit a model:
      - submit/index.md
      - Reference: submit/reference.md
  - Protocol:
      - protocol.md
      - How it works: how-it-works.md
  - About:
      - Releases: releases.md
      - Cite: cite.md
